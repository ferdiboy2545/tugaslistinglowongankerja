<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobConnect - Listing Lowongan Pekerjaan & Magang</title>
<meta name="description" content="Tugas Pemrograman Web - Listing Lowongan Pekerjaan dan Magang">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:#fff;min-height:100vh
}
.container{width:92%;max-width:1400px;margin:auto}
.hero{text-align:center;padding:70px 0}
.hero h1{font-size:3rem;font-weight:800}
.hero p{color:#cbd5e1;margin-top:10px}
.highlight{
background:linear-gradient(90deg,#60a5fa,#a78bfa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}
.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;margin-bottom:35px
}
.stat,.card,.toolbar,.modal-content{
background:rgba(255,255,255,.06);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px
}
.stat{padding:20px;text-align:center}
.stat h2{font-size:2rem}
.toolbar{
padding:18px;display:flex;gap:15px;flex-wrap:wrap;margin-bottom:30px
}
input,select{
padding:12px;border:none;border-radius:12px;flex:1;
background:#1f2937;color:white
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;padding-bottom:50px
}
.card{
overflow:hidden;transition:.35s;cursor:pointer
}
.card:hover{transform:translateY(-10px)}
.card img{width:100%;height:200px;object-fit:cover}
.content{padding:18px}
.badge{
display:inline-block;padding:6px 12px;border-radius:999px;
background:#2563eb;font-size:.8rem;margin-bottom:10px
}
.title{font-size:1.2rem;font-weight:700;margin-bottom:10px}
.meta{font-size:.9rem;color:#cbd5e1;line-height:1.8}
.salary{color:#4ade80;font-weight:700;margin-top:10px}
.btn{
margin-top:15px;width:100%;padding:12px;border:none;
border-radius:12px;background:#3b82f6;color:white;font-weight:600
}
.modal{
display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
justify-content:center;align-items:center;padding:20px;z-index:999
}
.modal-content{
max-width:700px;width:100%;padding:25px
}
.close{float:right;font-size:26px;cursor:pointer}
.footer{text-align:center;padding:30px;color:#94a3b8}
.empty{text-align:center;padding:50px;color:#cbd5e1}
</style>
</head>
<body>

<div class="container">

<section class="hero">
<h1><span class="highlight">JobConnect</span> Indonesia</h1>
<p>Website Listing Lowongan Pekerjaan & Magang</p>
</section>

<div class="stats">
<div class="stat"><h2>10+</h2><p>Lowongan Aktif</p></div>
<div class="stat"><h2>8</h2><p>Perusahaan</p></div>
<div class="stat"><h2>5</h2><p>Kategori</p></div>
<div class="stat"><h2>100%</h2><p>Responsive</p></div>
</div>

<div class="toolbar">
<input id="search" placeholder="Cari posisi pekerjaan...">
<select id="category">
<option value="all">Semua Kategori</option>
<option>Frontend</option>
<option>Backend</option>
<option>UI/UX</option>
<option>Data</option>
<option>Magang</option>
</select>
</div>

<div id="jobs" class="grid"></div>

<div class="footer">
Tugas Pemrograman Web - Listing Lowongan Pekerjaan & Magang
</div>

</div>

<div id="modal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div id="detail"></div>
</div>
</div>

<script>
const jobs=[
{
title:"Frontend Developer",
company:"Tech Nusantara",
category:"Frontend",
location:"Jakarta",
salary:"Rp 8-12 Juta",
image:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200",
desc:"Mengembangkan antarmuka web modern menggunakan HTML, CSS, JavaScript dan React."
},
{
title:"Backend Developer",
company:"Digital Solusi",
category:"Backend",
location:"Bandung",
salary:"Rp 9-14 Juta",
image:"https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=1200",
desc:"Membangun API, database dan sistem backend yang scalable."
},
{
title:"UI/UX Designer",
company:"Creative Studio",
category:"UI/UX",
location:"Yogyakarta",
salary:"Rp 7-10 Juta",
image:"https://images.unsplash.com/photo-1561070791-2526d30994b5?w=1200",
desc:"Merancang desain aplikasi dan website yang menarik dan user friendly."
},
{
title:"Data Analyst",
company:"Insight Data",
category:"Data",
location:"Surabaya",
salary:"Rp 8-13 Juta",
image:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=1200",
desc:"Mengolah dan menganalisis data bisnis untuk pengambilan keputusan."
},
{
title:"Magang Web Developer",
company:"Startup XYZ",
category:"Magang",
location:"Remote",
salary:"Rp 2 Juta",
image:"https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200",
desc:"Program magang bagi mahasiswa yang ingin belajar pengembangan web."
},
{
title:"Frontend Intern",
company:"NextGen Tech",
category:"Magang",
location:"Jakarta",
salary:"Rp 2.5 Juta",
image:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1200",
desc:"Magang frontend developer dengan mentor profesional."
}
];

const jobsContainer=document.getElementById("jobs");

function render(data){
if(!data.length){
jobsContainer.innerHTML='<div class="empty">Lowongan tidak ditemukan.</div>';
return;
}
jobsContainer.innerHTML=data.map((job,i)=>`
<div class="card" onclick="showDetail(${i})">
<img src="${job.image}">
<div class="content">
<span class="badge">${job.category}</span>
<div class="title">${job.title}</div>
<div class="meta">
🏢 ${job.company}<br>
📍 ${job.location}
</div>
<div class="salary">${job.salary}</div>
<button class="btn">Lihat Detail</button>
</div>
</div>
`).join('');
}

render(jobs);

function filterData(){
const keyword=document.getElementById('search').value.toLowerCase();
const cat=document.getElementById('category').value;

const result=jobs.filter(j=>
(j.title.toLowerCase().includes(keyword)||j.company.toLowerCase().includes(keyword))
&& (cat==='all'||j.category===cat)
);
render(result);
}

document.getElementById('search').addEventListener('input',filterData);
document.getElementById('category').addEventListener('change',filterData);

function showDetail(index){
const j=jobs[index];
document.getElementById('detail').innerHTML=`
<h2>${j.title}</h2>
<br>
<p><b>Perusahaan:</b> ${j.company}</p>
<p><b>Kategori:</b> ${j.category}</p>
<p><b>Lokasi:</b> ${j.location}</p>
<p><b>Gaji:</b> ${j.salary}</p>
<br>
<p>${j.desc}</p>
<br>
<button class="btn">Lamar Sekarang</button>
`;
document.getElementById('modal').style.display='flex';
}

function closeModal(){
document.getElementById('modal').style.display='none';
}
</script>

</body>
</html>
